services:
  - type: web
    name: prospectradar
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: prospectradar-db
          property: connectionString
    disk:
      name: whatsapp-session
      mountPath: /app/server/.whatsapp-session
      sizeGB: 1

databases:
  - name: prospectradar-db
    plan: starter